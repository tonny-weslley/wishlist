<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Lista compartilhada · Wishlist</title><script>try{const p=localStorage.getItem('wishlist.theme');document.documentElement.dataset.theme=p==='dark'||(p!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch{}</script><style>
:root{font:14px system-ui,sans-serif;color-scheme:light;--bg:#f4f6f8;--surface:#fff;--text:#17202a;--muted:#526171;--border:#dce2e8;--accent:#1d4ed8;--media:#f7f9fb}html[data-theme=dark]{color-scheme:dark;--bg:#101113;--surface:#191b1f;--text:#f1f3f5;--muted:#aab2be;--border:#363b43;--accent:#60a5fa;--media:#23262b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header,main{max-width:1160px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px}.brand{font-size:22px;font-weight:600}small,p{color:var(--muted);line-height:1.6}h1{font-size:26px;font-weight:600;overflow-wrap:anywhere}#description{white-space:pre-line;overflow-wrap:anywhere}.readonly{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px}.summary{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.summary strong{font-size:23px;display:block;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}.photo{height:220px;position:relative;display:flex;align-items:center;justify-content:center;background:var(--media);color:var(--muted)}.photo img{width:100%;height:100%;object-fit:contain;padding:16px}.rank{position:absolute;top:10px;left:10px;background:var(--surface);border:1px solid var(--border);padding:4px 8px;border-radius:4px}.body{padding:20px}h2{font-size:17px;line-height:1.5;margin:0}.price{font-size:23px;font-weight:650;font-variant-numeric:tabular-nums;margin:16px 0}.body p{font-size:13px;white-space:pre-line;overflow-wrap:anywhere}a{color:var(--accent);text-underline-offset:3px}.tag{font-size:12px;color:var(--muted);display:block;margin:8px 0}.error{padding:24px;border:1px solid var(--border);background:var(--surface);border-radius:8px}footer{max-width:1160px;margin:24px auto;padding:24px;color:var(--muted);font-size:12px}a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}@media(max-width:600px){header,main{padding:16px}header{align-items:center}.readonly{font-size:12px}h1{font-size:23px}}
</style><header><div class="brand">Wishlist</div><div class="readonly">Somente visualização</div></header><main><h1 id="name">Carregando lista…</h1><p id="description"></p><p id="dates"></p><div class="summary" id="summary"></div><div id="error" class="error" role="alert" hidden></div><div class="grid" id="items"></div></main><footer>Esta é uma cópia independente, somente para leitura. O link contém os dados, não expira e não pode ser revogado.</footer><script src="assets/js/schema.js"></script><script src="assets/js/planning.js"></script><script>
const $=id=>document.getElementById(id);
const url=value=>{try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:''}catch{return ''}};
const money=(n,c)=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:c}).format(n);
function text(tag,value,cls=''){const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;return el}
async function load(){try{const raw=location.hash.startsWith('#snapshot=')?location.hash.slice(10):'';if(!raw||raw.length>32000||!/^[A-Za-z0-9_-]+$/.test(raw))throw Error('Link inválido ou grande demais.');const data=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(raw.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));if(!data||typeof data.name!=='string'||!Array.isArray(data.items)||data.items.length>1000)throw Error('Lista inválida.');data.description=String(data.description||'').slice(0,2000);data.items=data.items.map(WishlistSchema.product);$('name').textContent=data.name;document.title=data.name+' · Wishlist';$('description').textContent=data.description;$('dates').textContent='Cópia independente · não acompanha alterações na lista original';const sums={};for(const i of WishlistPlanning.cheapest(WishlistPlanning.pending(data.items).filter(i=>i.price!==null)))sums[i.currency]=(sums[i.currency]||0)+Math.round(i.price*100);const number=text('div','');number.append(text('small','Produtos'),text('strong',data.items.length));const total=text('div','');total.append(text('small','Total pendente'),text('strong',Object.entries(sums).map(([c,n])=>money(n/100,c)).join(' + ')||'—'));$('summary').append(number,total);if(!data.items.length)$('items').append(text('p','Esta lista ainda não tem produtos.'));data.items.forEach((i,index)=>{const card=text('article','','card'),photo=text('div','','photo');const image=url(i.image);if(image){const img=document.createElement('img');img.alt=i.name;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{{img.remove();photo.prepend(text('small','Imagem indisponível'))}};img.src=image;photo.append(img)}else photo.append(text('small','Sem imagem'));photo.append(text('span','#'+(index+1),'rank'));const body=text('div','','body');body.append(text('h2',i.name),text('span',(i.category||'Sem categoria')+(i.done?' · Comprado':''),'tag'),text('div',i.price===null?'Valor não informado':money(i.price,i.currency),'price'));if(i.description)body.append(text('p',i.description));if(url(i.url)){const a=text('a','Ver na loja ↗');a.href=url(i.url);a.target='_blank';a.rel='noopener noreferrer';body.append(a)}card.append(photo,body);$('items').append(card)})}catch(e){$('name').textContent='Lista indisponível';$('error').hidden=false;$('error').textContent=e.message}}
load();
</script></html>
